name: iptv_app
description: Lecteur IPTV simple pour chaînes en clair (playlists M3U).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Réseau : récupérer la playlist M3U
  http: ^1.2.0

  # Lecture vidéo HLS (.m3u8) — video_player utilise ExoPlayer sous Android
  video_player: ^2.8.0
  chewie: ^1.8.0

  # Affichage des logos de chaînes avec cache
  cached_network_image: ^3.3.0

  # Formatage des dates (agenda des matchs)
  intl: ^0.19.0

  # Stockage local (favoris, récents, URL de playlist)
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2B1A12"
  adaptive_icon_foreground: "assets/icon/foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/
